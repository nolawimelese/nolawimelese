name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # include_all_commits is intentionally omitted: it hits the commit Search API,
          # which the default GITHUB_TOKEN cannot call ("Resource not accessible by
          # integration"). Adding it back requires a PAT in `token` below.
          options: username=${{ github.repository_owner }}&hide_title=true&hide_rank=false&show_icons=true&count_private=true&disable_animations=false&theme=cobalt&locale=en&hide_border=true&rank_icon=percentile
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
